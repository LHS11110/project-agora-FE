[package]
name = "agora-wgpu-renderer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
js-sys = "0.3.77"
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4.50"
wgpu = { version = "24.0", default-features = false, features = ["webgpu", "webgl", "wgsl"] }

[dependencies.web-sys]
version = "0.3.77"
features = [
  "Document",
  "Window",
  "Element",
  "HtmlCanvasElement",
  "OffscreenCanvas",
  "CanvasRenderingContext2d",
  "ImageData",
  "WebGl2RenderingContext",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
