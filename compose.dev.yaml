services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: project-agora-frontend:dev
    container_name: agora-frontend-dev
    restart: unless-stopped
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    volumes:
      - .:/app
      # Hide host CA signing material from the workspace bind mount.
      - type: tmpfs
        target: /app/.local-https
      - agora-fe-node-modules:/app/node_modules
      - frontend-tls:/run/tls:ro
    environment:
      VITE_API_PROXY_TARGET: ${VITE_DOCKER_API_PROXY_TARGET:-https://agora-nginx}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
      SERVICE_TLS_CERT: /run/tls/fullchain.pem
      SERVICE_TLS_KEY: /run/tls/privkey.pem
      SERVICE_TLS_CA: /run/tls/ca.pem
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    networks:
      - agora-web
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:5173/',{ca:require('fs').readFileSync('/run/tls/ca.pem')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  agora-web:
    external: true
    name: agora-web

volumes:
  agora-fe-node-modules:
  frontend-tls:
    external: true
    name: agora-frontend-tls
