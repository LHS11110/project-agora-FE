services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: project-agora-frontend:dev
    container_name: agora-frontend-dev
    restart: unless-stopped
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - agora-fe-node-modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: ${VITE_DOCKER_API_PROXY_TARGET:-http://agora-nginx}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
      VITE_CPP_WS_HOST: ""
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    networks:
      - agora-web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  agora-web:
    external: true
    name: agora-web

volumes:
  agora-fe-node-modules:
