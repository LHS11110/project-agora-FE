<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#302c4a" />
    <meta name="description" content="FreLog — 생각을 자유롭게 기록하고 연결하는 협업 캔버스" />
    <script>
      (() => {
        const reloadKey = 'agora:stale-vite-chunk-reload-at';
        window.addEventListener('vite:preloadError', (event) => {
          let lastReloadAt = 0;
          try {
            lastReloadAt = Number(sessionStorage.getItem(reloadKey)) || 0;
            if (Date.now() - lastReloadAt < 15000) return;
            sessionStorage.setItem(reloadKey, String(Date.now()));
          } catch {
            return;
          }
          event.preventDefault();
          window.location.reload();
        });
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>FreLog — 생각을 기록하고 연결하는 캔버스</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
