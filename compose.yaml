name: agora-frontend

services:
  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
        VITE_WEBRTC_ICE_SERVERS: ${VITE_WEBRTC_ICE_SERVERS:-}
    image: project-agora-frontend:local
    volumes:
      - frontend-dist:/output

volumes:
  frontend-dist:
    name: agora-frontend-dist
