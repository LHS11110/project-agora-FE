<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1135" width="1600" height="1135" role="img" aria-label="02-persistence-and-deletion"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b7a"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="145" width="1520" height="410" fill="#f6f7f8" stroke="#8b949d" stroke-width="1.5"/><rect x="70" y="240" width="430" height="130" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="585" y="240" width="430" height="130" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="1100" y="240" width="430" height="130" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="40" y="600" width="1520" height="365" fill="#f6f7f8" stroke="#8b949d" stroke-width="1.5"/><rect x="70" y="695" width="430" height="125" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="585" y="695" width="430" height="160" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="1100" y="695" width="430" height="125" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><polyline points="500,305 585,305" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1015,305 1100,305" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="500,755 585,755" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1015,755 1100,755" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><text font-family="Noto Sans CJK KR, sans-serif" font-size="32" fill="#202a34" font-weight="600"><tspan x="40" y="57">그림 2. 데이터 보존과 영구 삭제의 경계</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="400"><tspan x="40" y="98">저장 확인, 캐시 회수, 영구 삭제는 서로 다른 단계입니다. | 현재 코드 기준: 2026.10.15</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#202a34" font-weight="600"><tspan x="60" y="184">A. 활성 데이터의 보존</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="84" y="274">활성 원본: Redis</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="84" y="306">객체 / 채팅 / 캔버스 설정</tspan><tspan x="84" y="331.2">CRDT 이력 / 순번 / 중복 처리 기록</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="599" y="274">회수 전 저장 검증</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="599" y="306">대기 쓰기 완료 + LRU flush</tspan><tspan x="599" y="331.2">최신 문서 읽기 / 캐시 세대 확인</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1114" y="274">비활성 원본: Elasticsearch</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1114" y="306">전체 문서 스냅샷</tspan><tspan x="1114" y="331.2">객체·처리 기록은 인코딩해 보관</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="600"><tspan x="75" y="445">실패 → Redis와 서버 할당 유지. 저장에 성공하기 전에는 활성 데이터를 버리지 않습니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="75" y="503">canvas_result는 Redis 주 노드 반영 확인입니다. 복제본 동기화·디스크 fsync·ES 스냅샷 완료와는 구분됩니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="24" fill="#202a34" font-weight="600"><tspan x="60" y="639">B. 소유자 또는 시스템 관리자의 영구 삭제 요청</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="84" y="729">삭제 조건 확인</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="84" y="761">소유자·시스템 관리자 권한</tspan><tspan x="84" y="786.2">활성 cached=true이면 삭제 거절</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="599" y="729">비활성 캔버스 삭제</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="599" y="761">MS SQL 등록 제거 요청</tspan><tspan x="599" y="786.2">Elasticsearch 문서 삭제</tspan><tspan x="599" y="811.4">대표 이미지·리소스 디렉터리 정리</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1114" y="729">삭제 완료</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1114" y="761">캔버스 목록·저장 문서·리소스 제거</tspan><tspan x="1114" y="786.2">같은 캔버스에 다시 접속할 수 없음</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="75" y="913">접속 종료 직후에는 유휴 회수까지 기다려야 할 수 있습니다. 여러 저장소 전체를 묶는 단일 원자 트랜잭션은 아닙니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="40" y="1038">범위: 캔버스 문서의 논리적 수명 주기입니다. 서버 정상 종료 시에도 저장 절차를 수행하며, 전원·복제 장애의 무손실을 뜻하지 않습니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="17" fill="#202a34" font-weight="400"><tspan x="40" y="1087">근거: Spring CanvasService / C++ CanvasLifecycleMemory·CanvasServiceMemory·CanvasSnapshotMemory / Phoenix Room</tspan></text></svg>
