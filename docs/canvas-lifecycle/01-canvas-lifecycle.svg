<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1135" width="1600" height="1135" role="img" aria-label="01-canvas-lifecycle"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b7a"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="60" y="170" width="440" height="130" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="580" y="170" width="440" height="130" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="1100" y="170" width="440" height="130" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="1100" y="425" width="440" height="160" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="580" y="425" width="440" height="160" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="60" y="425" width="440" height="160" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="60" y="735" width="440" height="150" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="580" y="735" width="440" height="150" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="1100" y="735" width="440" height="150" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="40" y="965" width="1520" height="125" fill="#f6f7f8" stroke="#8b949d" stroke-width="1.5"/><polyline points="500,235 580,235" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1020,235 1100,235" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1320,300 1320,425" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1100,505 1020,505" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="580,505 500,505" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="280,585 280,735" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="500,810 580,810" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1020,810 1100,810" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1540,810 1570,810 1570,350 1450,350 1450,300" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#arrow)" /><text font-family="Noto Sans CJK KR, sans-serif" font-size="32" fill="#202a34" font-weight="600"><tspan x="40" y="57">그림 1. Canvas 데이터의 생명 주기</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#202a34" font-weight="400"><tspan x="40" y="99">생성 → 비활성 보관 → 활성화·공동 편집 → 안전한 회수 → 재접속 또는 삭제</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="74" y="204">1. 캔버스 생성</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="74" y="236">Spring: 이름·소유자·접근 정보 생성</tspan><tspan x="74" y="261.2">MS SQL ID 발급 / 초기 ES 문서 저장</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="594" y="204">2. 비활성 상태로 보관</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="594" y="236">MS SQL: 등록·할당 정보</tspan><tspan x="594" y="261.2">Elasticsearch: 캔버스 문서</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1114" y="204">3. 접근 요청·권한 확인</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1114" y="236">Spring: 권한·비밀번호 확인</tspan><tspan x="1114" y="261.2">C++ 서버 할당 / 접근 JWT 발급</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1114" y="459">4. 활성 데이터 준비</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1114" y="491">캐시 존재: 기존 Redis 문서 재사용</tspan><tspan x="1114" y="516.2">캐시 없음: ES → Redis 복원</tspan><tspan x="1114" y="541.4">C++ 인스턴스 / cached=true</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="594" y="459">5. 최신 상태 제공</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="594" y="491">브로커 등록 후 서버 스냅샷 조회</tspan><tspan x="594" y="516.2">객체·전역 순번·처리 카운터 전달</tspan><tspan x="594" y="541.4">브라우저별 로컬 렌더링</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="74" y="459">6. 공동 편집·즉시 저장</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="74" y="491">브라우저 → Phoenix → C++ → Redis</tspan><tspan x="74" y="516.2">변경·순번·처리 기록을 원자 반영</tspan><tspan x="74" y="541.4">확정 변경을 참여자에게 전달</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="74" y="769">7. 유휴 상태 판정</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="74" y="801">데이터 소켓의 lease가 활성 유지</tspan><tspan x="74" y="826.2">최근 질의 없음: 기본 TTL 90초</tspan><tspan x="74" y="851.4">회수 조건 확인 후 언로드 시도</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="594" y="769">8. 안전한 스냅샷 저장</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="594" y="801">대기 쓰기 완료 / LRU flush 확인</tspan><tspan x="594" y="826.2">Redis 최신 문서 → Elasticsearch</tspan><tspan x="594" y="851.4">저장 실패 시 Redis·할당 유지</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1114" y="769">9. 활성 자원 회수</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1114" y="801">MS SQL: cached=false 먼저 반영</tspan><tspan x="1114" y="826.2">세대가 일치하는 Redis 캐시만 제거</tspan><tspan x="1114" y="851.4">C++ 메모리 풀에서 해제</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="1335" y="362">접속 준비</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="300" y="666">모든 연결 종료 후</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1110" y="381">재접속하면 다시 활성화</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="60" y="1002">회수는 데이터 삭제가 아닙니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="60" y="1038">비활성 캔버스는 ES에 보관됩니다. 다시 접속하면 복원합니다. 서버 재기동 시 기존 활성 Redis를 우선 사용합니다.</tspan><tspan x="60" y="1063.2">활성 Redis를 읽지 못했을 때 오래된 ES 스냅샷으로 조용히 되돌리지 않습니다. 브라우저 호스트는 필요하지 않습니다.</tspan></text></svg>
