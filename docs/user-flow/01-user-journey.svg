<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1210" width="1600" height="1210" role="img" aria-label="01-user-journey"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b7a"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="610" y="140" width="380" height="105" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="610" y="295" width="380" height="90" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="150" y="440" width="460" height="100" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="990" y="440" width="460" height="100" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="590" y="610" width="420" height="100" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="590" y="770" width="420" height="100" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="590" y="930" width="420" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="1190" y="930" width="320" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="150" y="930" width="350" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="150" y="770" width="350" height="100" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><polyline points="800,245 800,295" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="800,385 800,410 380,410 380,440" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="800,385 800,410 1220,410 1220,440" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="380,540 380,575 800,575 800,610" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1220,540 1220,575 800,575" fill="none" stroke="#345b7a" stroke-width="2" /><polyline points="800,710 800,770" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="800,870 800,930" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1010,985 1190,985" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="590,985 500,985" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><polyline points="500,820 590,820" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="150,985 90,985 90,340 610,340" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)" /><text font-family="Noto Sans CJK KR, sans-serif" font-size="32" fill="#202a34" font-weight="600"><tspan x="40" y="57">사용자 관점 핵심 흐름도</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="21" fill="#202a34" font-weight="400"><tspan x="40" y="99">로그인 → 캔버스 검색·생성 → 접속 → 공동 편집 → 다른 캔버스 탐색</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="624" y="174">1. 로그인</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="624" y="206">이메일·비밀번호 입력</tspan><tspan x="624" y="231.2">계정이 없으면 회원가입</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="624" y="329">2. 캔버스 탐색</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="624" y="361">검색 또는 새 캔버스 만들기</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="164" y="474">기존 캔버스 검색</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="164" y="506">캔버스 이름으로 검색</tspan><tspan x="164" y="531.2">목록에서 원하는 캔버스 선택</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1004" y="474">새 캔버스 생성</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1004" y="506">캔버스 이름 입력</tspan><tspan x="1004" y="531.2">설명·대표 이미지·비밀번호는 선택</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="604" y="644">3. 캔버스 접속</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="604" y="676">접근 권한 확인</tspan><tspan x="604" y="701.2">필요 시 캔버스 비밀번호 입력</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="604" y="804">4. 최신 상태 동기화</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="604" y="836">기존 작업 내용 불러오기</tspan><tspan x="604" y="861.2">동기화가 끝나면 편집 가능</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="604" y="964">5. 편집 및 공동 작업</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="604" y="996">도형·텍스트·드로잉·이미지 편집</tspan><tspan x="604" y="1021.2">참여자의 변경·포인터 실시간 공유</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1204" y="964">함께 소통하기 (선택)</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1204" y="996">채팅 / 음성 통화</tspan><tspan x="1204" y="1021.2">참여자와 같은 캔버스에서 작업</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="164" y="964">6. 캔버스 나가기</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="164" y="996">캔버스 목록으로 돌아가기</tspan><tspan x="164" y="1021.2">다른 캔버스 검색·생성</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="164" y="804">작업 중 연결이 끊기면</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="164" y="836">연결 복구·재동기화</tspan><tspan x="164" y="861.2">준비 완료 후 작업 계속</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="17" fill="#202a34" font-weight="400"><tspan x="480" y="399">기존 작업에 참여</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="17" fill="#202a34" font-weight="400"><tspan x="1015" y="399">새 작업 시작</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="17" fill="#202a34" font-weight="400"><tspan x="1025" y="565">생성 후 자동 이동</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="1040" y="966">필요할 때</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="100" y="1108">다른 캔버스 선택</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="40" y="1158">검색과 생성은 두 가지 진입 경로입니다. 어느 경로로 시작해도 같은 캔버스 접속·편집 흐름으로 이어집니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="17" fill="#202a34" font-weight="400"><tspan x="40" y="1192">로그인·권한·비밀번호 오류가 표시되면 안내에 따라 계정과 접근 정보를 확인합니다. | 실제 화면 흐름 기준: 2026.10.15</tspan></text></svg>
