<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 870" width="1600" height="870" role="img" aria-label="02-replication-protocol"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b7a"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="140" width="290" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="425" y="140" width="290" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="810" y="140" width="320" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="1220" y="140" width="340" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="40" y="735" width="1520" height="110" fill="#f6f7f8" stroke="#8b949d" stroke-width="1.5"/><polyline points="185,250 185,710" fill="none" stroke="#b6bdc4" stroke-width="2" /><polyline points="570,250 570,710" fill="none" stroke="#b6bdc4" stroke-width="2" /><polyline points="970,250 970,710" fill="none" stroke="#b6bdc4" stroke-width="2" /><polyline points="1390,250 1390,710" fill="none" stroke="#b6bdc4" stroke-width="2" /><polyline points="185,290 570,290" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="570,345 970,345" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="970,410 1390,410" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,465 970,465" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="970,555 570,555" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="570,620 185,620" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><text font-family="Noto Sans CJK KR, sans-serif" font-size="31" fill="#202a34" font-weight="600"><tspan x="40" y="56">그림 2. 호스트 없는 서버 저장 및 변경 공유 흐름</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="400"><tspan x="40" y="96">논리적 메시지 흐름입니다. 게이트웨이와 저장소까지의 중간 경로는 저장 경로 항목으로 묶어 표시했습니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="54" y="174">편집 중인 브라우저</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="54" y="206">즉시 렌더링 / 서버 저장 대기</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="439" y="174">Phoenix 브로커</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="439" y="206">인증된 캔버스 룸 내 중계</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="824" y="174">C++ 캔버스 서버</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="824" y="206">권한 검증 / 순서·중복 요청 관리</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1234" y="174">Redis 저장소</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1234" y="206">객체 변경 + 처리 내역 원자 반영</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="205" y="277">1. 변경 전송 (canvas_ops)</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="587" y="332">2. 인증된 변경을 서버로 라우팅</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="990" y="397">3. 객체·처리 내역 원자 저장</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="990" y="452">4. Redis 반영 확인</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="587" y="542">5. 저장 결과 + 순번이 있는 확정 변경</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="205" y="607">6. 모든 참여자에게 전달 · 각자 렌더링</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="60" y="768">canvas_result는 Redis 반영 확인입니다. canvas_commit은 각 사용자가 자기 화면에 렌더링할 변경입니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="60" y="804">복구: 동일 요청 재전송 / 저장 내역으로 중복 적용 방지 / 순번 누락·접속 복구 시 최신 스냅샷 조회.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="60" y="838">마우스·레이저 등 접속 상태는 Phoenix가 중계합니다. P2P는 음성 통화 전용이며 브라우저 호스트는 없습니다.</tspan></text></svg>
