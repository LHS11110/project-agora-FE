<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 870" width="1600" height="870" role="img" aria-label="02-replication-protocol"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#345b7a"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="140" width="290" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="425" y="140" width="290" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="810" y="140" width="320" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="1220" y="140" width="340" height="110" fill="#ffffff" stroke="#202a34" stroke-width="1.5"/><rect x="40" y="735" width="1520" height="110" fill="#f6f7f8" stroke="#8b949d" stroke-width="1.5"/><polyline points="185,250 185,710" fill="none" stroke="#b6bdc4" stroke-width="2" /><polyline points="570,250 570,710" fill="none" stroke="#b6bdc4" stroke-width="2" /><polyline points="970,250 970,710" fill="none" stroke="#b6bdc4" stroke-width="2" /><polyline points="1390,250 1390,710" fill="none" stroke="#b6bdc4" stroke-width="2" /><polyline points="185,290 570,290" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="570,345 970,345" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="970,410 570,410" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="570,465 185,465" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="970,555 1390,555" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,620 970,620" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><text font-family="Noto Sans CJK KR, sans-serif" font-size="31" fill="#202a34" font-weight="600"><tspan x="40" y="56">그림 2. 호스트를 기준으로 하는 편집 내용의 복제 흐름</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="400"><tspan x="40" y="96">논리적 메시지 흐름입니다. 게이트웨이와 저장소까지의 중간 경로는 저장 경로 항목으로 묶어 표시했습니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="54" y="174">편집 중인 브라우저</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="54" y="206">로컬 미리보기 / 승인 대기 요청</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="439" y="174">Phoenix 브로커</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="439" y="206">인증된 캔버스 룸 내 중계</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="824" y="174">선출된 브라우저 호스트</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="824" y="206">권한·순서 검증 / 요청 카운터</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1234" y="174">저장 경로</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1234" y="206">Phoenix → C++ → HAProxy → Redis</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="205" y="277">1. 편집 변경 제안</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="587" y="332">2. 호스트 term과 함께 전달</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="587" y="397">3. 확정 변경 + host_ack</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="205" y="452">4. 순서가 있는 확정 변경 / 승인 응답</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="990" y="542">5. 배치 저장 요청 (host_item_batch)</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="990" y="607">6. 저장 응답 (Redis 반영 확인)</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="60" y="768">host_ack는 브라우저 수용, host_batch_result는 C++ 적용·Redis 반영을 뜻합니다. 복제·디스크 영속성 완료와는 구분됩니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="60" y="804">복구: 크기를 제한한 분할 전송·수신 확인, 진행 정체 시 재전송, 중복 적용 방지, 순번에 기반한 재동기화.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="60" y="838">접속 상태 이벤트는 Phoenix로 브로드캐스트하며, P2P는 음성 통화에만 사용합니다. 호스트 기반 복제로 Raft 합의 방식과는 다릅니다.</tspan></text></svg>
