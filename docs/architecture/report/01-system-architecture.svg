" fill="#f6f7f8" stroke="#8b949d" stroke-width="1.5"/><polyline points="315,265 405,265" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="520,325 520,485" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="635,525 675,525 675,272 725,272" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="635,575 725,575" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="190,395 190,630" fill="none" stroke="#56616b" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,685 675,685 675,615 725,615" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="895,640 895,700" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="895,340 895,365" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1065,270 1110,270 1110,240 1155,240" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1065,410 1120,410 1120,285 1155,285" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1065,760 1100,760 1100,310 1155,310" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1300,325 1300,385 1245,385 1245,435" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,325 1390,385 1445,385 1445,435" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1535,265 1547,265 1547,610 1345,610 1345,670" fill="none" stroke="#345b7a" stroke-width="2" marker-end="url(#arrow)"/><text font-family="Noto Sans CJK KR, sans-serif" font-size="31" fill="#202a34" font-weight="600"><tspan x="40" y="56">그림 1. Project Agora의 배포 시스템 아키텍처</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="400"><tspan x="40" y="96">실행 환경의 구성과 역할 경계 | 확인 기준: 2026년 10월 15일</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="600"><tspan x="55" y="177">클라이언트</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="600"><tspan x="395" y="177">외부 진입 계층</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="600"><tspan x="715" y="177">애플리케이션 서비스</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="600"><tspan x="1145" y="177">저장소 계층</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="79" y="239">브라우저 애플리케이션</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="79" y="271">React / Vite / PixiJS</tspan><tspan x="79" y="296.2">로컬 편집 초안 + Automerge</tspan><tspan x="79" y="321.4">각 클라이언트가 독립 렌더링</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="79" y="664">다른 참여자 브라우저</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="79" y="696">WebRTC 음성 통화 단말</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="419" y="239">호스트 Nginx</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="419" y="271">외부 HTTPS / WSS :443</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="419" y="519">Docker Nginx</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="419" y="551">정적 프런트엔드 / API / WSS</tspan><tspan x="419" y="576.2">경로별 서비스 라우팅</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="739" y="239">Spring Boot</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="739" y="271">인증·권한·캔버스 등록 관리</tspan><tspan x="739" y="296.2">접근 JWT 발급 / 서버 할당</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="739" y="399">E5 검색 워커</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="739" y="431">임베딩 처리 (내부 게이트웨이 경유)</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="739" y="519">Phoenix 룸 브로커</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="739" y="551">참여자 관리 / 변경 브로드캐스트</tspan><tspan x="739" y="576.2">중계 / 접속 상태 브로드캐스트</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="739" y="734">C++ 캔버스 서비스</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="739" y="766">객체 상태 관리 / 쓰기 검증</tspan><tspan x="739" y="791.2">Redis 반영 / 수명주기별 스냅샷</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1169" y="239">HAProxy 저장소 브로커</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1169" y="271">TCP 중계 / TLS 암호문 통과</tspan><tspan x="1169" y="296.2">SQL · ES · Redis · Sentinel 연결</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1169" y="469">MS SQL Server</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1169" y="501">Express / 단일 노드</tspan><tspan x="1169" y="526.2">계정 / 접근 권한</tspan><tspan x="1169" y="551.4">캔버스 등록 정보</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1369" y="469">Elasticsearch</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1369" y="501">데이터 노드 1대</tspan><tspan x="1369" y="526.2">스냅샷</tspan><tspan x="1369" y="551.4">검색용 데이터</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="22" fill="#202a34" font-weight="600"><tspan x="1169" y="704">Redis + Sentinel</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="1169" y="736">주 노드 1대 + 복제본 2대</tspan><tspan x="1169" y="761.2">Sentinel 3대 / 정족수 2</tspan><tspan x="1169" y="786.4">활성 문서 / RedisJSON / AOF</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="329" y="228">HTTPS</tspan><tspan x="329" y="250.4">WSS</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="535" y="401">루프백</tspan><tspan x="535" y="423.4">:8444</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="676" y="260">/api</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="650" y="564">/wss</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="206" y="502">WebRTC</tspan><tspan x="206" y="524.4">음성 통화 전용</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="422" y="673">RTC 연결 협상</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#202a34" font-weight="400"><tspan x="910" y="677">백엔드 라우팅</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="23" fill="#202a34" font-weight="600"><tspan x="60" y="958">제어 계층 | Project Orchestra</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="20" fill="#202a34" font-weight="400"><tspan x="60" y="1000">빌드 / Docker 순차 기동 / 상태 점검 / HTTPS·WSS 연결 검증</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="40" y="1073">배포 범위: 하나의 Docker 호스트. SQL·Elasticsearch는 단일 노드이며, Redis 복제는 비동기 방식입니다.</tspan></text><text font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#202a34" font-weight="400"><tspan x="40" y="1108">화살표는 요청·메시지 방향이며 응답 경로는 생략했습니다. 제어 도구는 실제 요청 처리 경로에 포함되지 않습니다.</tspan></text></svg>
